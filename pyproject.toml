[project]
name = "horragor-brief3"
version = "0.1.0"
description = "Private, observable multi-agent horror movie assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "prometheus-client>=0.22.1",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
]

[project.scripts]
horragor-build-index = "src.tools.faiss_store:main"
horragor-ingest = "src.ingestion.pipeline:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/migrations",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
]

[project.optional-dependencies]
api = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115.0",
    "langfuse>=4.14.5",
    "langgraph>=1.2.11",
    "pyjwt>=2.10.1",
    "uvicorn[standard]>=0.30.0",
]
data = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.115.0",
    "numpy>=2.4.6",
    "uvicorn[standard]>=0.30.0",
]
docs = [
    "sphinx>=8.2.3",
    "sphinx-rtd-theme>=3.0.2",
    "sphinxcontrib-mermaid>=1.0.0",
]
ingestion = [
    "faiss-cpu>=1.15.0",
    "numpy>=2.4.6",
    "pgvector>=0.4.1",
    "polars>=1.32.3",
    "pyspark>=4.0.0",
    "rapidfuzz>=3.14.0",
    "selenium>=4.35.0",
    "sqlalchemy>=2.0.43",
    "supabase>=2.18.1",
]
model = [
    "fastapi>=0.115.0",
    "openvino-genai>=2026.3.0.0",
    "uvicorn[standard]>=0.30.0",
]
persistence = [
    "pgvector>=0.4.1",
    "sqlalchemy>=2.0.43",
]
ui = [
    "streamlit>=1.62.0",
]

[dependency-groups]
dev = [
    "argon2-cffi>=25.1.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.115.0",
    "httpx2>=2.12.0",
    "langfuse>=4.14.5",
    "langgraph>=1.2.11",
    "mypy>=1.17.1",
    "numpy>=2.4.6",
    "pgvector>=0.4.1",
    "pyjwt>=2.10.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.10",
    "sqlalchemy>=2.0.43",
    "streamlit>=1.62.0",
    "types-requests>=2.32.4.20250809",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
